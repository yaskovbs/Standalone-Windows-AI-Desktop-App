[package]
name = "local-autonomous-ai"
version = "0.1.0"
description = "Internet-connected desktop AI assistant with a local LLM"
edition = "2021"

[lib]
name = "local_autonomous_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "process"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
scraper = "0.20"
urlencoding = "2"
anyhow = "1"
thiserror = "1"
llama-cpp-2 = "0.1"
tauri-plugin-dialog = "2"
cpal = "0.15"
hound = "3"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
xcap = "0.0.14"

[features]
# Enable NVIDIA acceleration: cargo tauri build --features cuda
cuda = ["llama-cpp-2/cuda"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
