name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify build tools (CMake / MSVC)
        shell: pwsh
        run: |
          cmake --version
          Write-Host "VS install:"
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

      - name: Install frontend dependencies
        working-directory: app
        run: npm install

      - name: Generate application icons (icon.ico is not committed)
        working-directory: app
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            Write-Host "Generating a placeholder source PNG..."
            Add-Type -AssemblyName System.Drawing
            $size = 512
            $bmp = New-Object System.Drawing.Bitmap $size, $size
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $bg = New-Object System.Drawing.Drawing2D.LinearGradientBrush(
              (New-Object System.Drawing.Point 0,0),
              (New-Object System.Drawing.Point $size,$size),
              [System.Drawing.Color]::FromArgb(255,37,99,235),
              [System.Drawing.Color]::FromArgb(255,124,58,237))
            $g.FillRectangle($bg, 0, 0, $size, $size)
            $font = New-Object System.Drawing.Font("Segoe UI", 220, [System.Drawing.FontStyle]::Bold)
            $sf = New-Object System.Drawing.StringFormat
            $sf.Alignment = [System.Drawing.StringAlignment]::Center
            $sf.LineAlignment = [System.Drawing.StringAlignment]::Center
            $white = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::White)
            $rect = New-Object System.Drawing.RectangleF 0, 0, $size, $size
            $g.DrawString("AI", $font, $white, $rect, $sf)
            $g.Dispose()
            New-Item -ItemType Directory -Force -Path "icon-src" | Out-Null
            $bmp.Save("icon-src/logo.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
            Write-Host "Running tauri icon generator..."
            npx @tauri-apps/cli icon icon-src/logo.png
          } else {
            Write-Host "icon.ico already present, skipping generation."
          }

      - name: Build Tauri app (NSIS installer + EXE)
        working-directory: app
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Collect build artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $base = "app/src-tauri/target/x86_64-pc-windows-msvc/release"
          Get-ChildItem -Path "$base" -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "*deps*" } |
            ForEach-Object { Copy-Item $_.FullName -Destination "artifacts/" -Force }
          Get-ChildItem -Path "$base/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName -Destination "artifacts/" -Force }
          Write-Host "Collected:"
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Upload Windows installer and EXE
        uses: actions/upload-artifact@v4
        with:
          name: LocalAutonomousAI-Windows
          path: artifacts/*
          if-no-files-found: error
